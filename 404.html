<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#D94F83" />
  <title>Página não encontrada — Viva em Equilíbrio</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="conteudo" class="pagina-erro">
    <div class="container pagina-erro__interno">
      <p class="pagina-erro__codigo" aria-hidden="true">404</p>
      <h1 class="pagina-erro__titulo">Página não encontrada</h1>
      <p class="pagina-erro__texto">
        O endereço acessado não existe ou foi movido. Volte ao início para continuar navegando
        pelo portal.
      </p>
      <p class="pagina-erro__acao">
        <a class="botao botao--primario" href="/">Voltar ao início</a>
      </p>
    </div>
  </main>
</body>
</html>
