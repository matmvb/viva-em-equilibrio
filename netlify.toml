# Configuração do Netlify — Viva em Equilíbrio
# Site estático (HTML/CSS/JS). Não há build.

[build]
  # Sem comando de build: publica os arquivos como estão.
  publish = "."

# Cabeçalhos de segurança aplicados a todas as páginas.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'"

# Cache do favicon (não muda com frequência).
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Não publicar arquivos internos do repositório.
# force = true porque estes arquivos existem na pasta publicada.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/LICENSE"
  to = "/404.html"
  status = 404
  force = true
